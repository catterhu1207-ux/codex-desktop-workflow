name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install "electron-update-safety @ git+https://github.com/catterhu1207-ux/electron-update-safety.git@25b32744cd6d4af7eae797010bbae655d9b9417c"
      - run: python -m pip install "desktop-adaptation-lab @ git+https://github.com/catterhu1207-ux/desktop-adaptation-lab.git@439e14c1889053a57090deb88b516e475493d9ca"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
