name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build all wheels
        run: python -m pip wheel . --wheel-dir dist\wheels
      - name: Assemble bundle
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME" -replace '^v', ''
          if (-not $version) { throw "Release version is empty" }
          $bundle = Join-Path "dist" "bundle"
          New-Item -ItemType Directory -Path $bundle -Force | Out-Null
          Copy-Item "dist\wheels\*.whl" $bundle
          Copy-Item "install.ps1" $bundle
          Copy-Item "msix_source.py" $bundle
          Copy-Item "README.md" $bundle
          Copy-Item "LICENSE" $bundle
          python -c "import json,sys; from pathlib import Path; from codex_desktop_workflow.workflow import SUPPORTED_PACKAGES; sources={v:{'asar_sha256':p.asar_sha256,'backend_sha256':p.backend_sha256} for v,p in SUPPORTED_PACKAGES.items()}; Path(sys.argv[1]).write_text(json.dumps({'package':'codex-desktop-workflow','version':sys.argv[2],'source_contracts':sources},indent=2),encoding='utf8')" (Join-Path $bundle "version.json") $version
          if ($LASTEXITCODE -ne 0) { throw "Source contracts could not be exported." }
          $zip = Join-Path "dist" "codex-desktop-workflow-bundle.zip"
          Compress-Archive -Path "$bundle\*" -DestinationPath $zip -Force
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $installHash = (Get-FileHash -LiteralPath "install.ps1" -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$hash  codex-desktop-workflow-bundle.zip",
            "$installHash  install.ps1"
          ) | Set-Content -LiteralPath "dist\SHA256SUMS.txt" -Encoding utf8NoBOM
      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh api "repos/$env:GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > dist/existing-tags.txt
          if ($LASTEXITCODE -ne 0) { throw "Release inventory could not be read." }
          if ((Get-Content dist/existing-tags.txt) -contains $tag) { throw "Release already exists; assets will not be overwritten." }
          gh release create $tag "dist\codex-desktop-workflow-bundle.zip" "install.ps1" "dist\SHA256SUMS.txt" --draft --verify-tag --title $tag --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw "Draft release creation failed." }
